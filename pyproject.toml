[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-agent-orchestrator"
version = "0.1.0"
description = "Orchestrate heterogeneous coding-agent CLIs (Claude Code, Codex, Gemini, ...) on one task: parallel, pipeline, and plan/fan-out strategies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kimdo-765" }]
keywords = ["agents", "orchestration", "claude-code", "codex", "gemini", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
]

[project.scripts]
cao = "cao.cli:main"

[project.urls]
Homepage = "https://github.com/Kimdo-765/cross_agent_ochestrator"
Repository = "https://github.com/Kimdo-765/cross_agent_ochestrator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
