<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cao · cross-agent orchestrator</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⟲</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">⟲ <b>cao</b> <span class="muted">cross-agent orchestrator</span></a>
  <div id="backends" class="chips"></div>
  <div class="spacer"></div>
  <span id="tunnel" class="muted small"></span>
  <button id="btn-new" class="btn primary">+ New task</button>
</header>

<main id="view"></main>

<!-- ---------- templates ---------- -->
<template id="tpl-list">
  <section class="list">
    <div class="list-head">
      <h1>Tasks</h1>
      <span class="muted small" id="list-count"></span>
    </div>
    <table class="tasks">
      <thead><tr><th>status</th><th>title</th><th>worker → reviewer</th><th>iter</th><th>score</th><th>cost</th><th>updated</th></tr></thead>
      <tbody id="task-rows"></tbody>
    </table>
    <p id="list-empty" class="muted hidden">No tasks yet — create one with <b>+ New task</b>.</p>
  </section>
</template>

<template id="tpl-form">
  <section class="form">
    <div class="page-head">
      <div>
        <h1>New task</h1>
        <p class="muted">A worker agent implements the request on its own branch; a different model reviews the real <code>git diff</code> and scores it 0–10. The loop repeats until the score passes.</p>
      </div>
    </div>
    <form id="task-form" autocomplete="off" novalidate>
      <div class="stack">

        <section class="card">
          <header class="card-head"><span class="step">1</span><div><h2>Task</h2><p>What should be done, and how the reviewer will judge it.</p></div></header>
          <div class="fields">
            <div class="field span2">
              <label for="f-request">Request <span class="req">*</span></label>
              <textarea id="f-request" name="request" rows="5" required placeholder="What should be built or changed? Be concrete: files, behaviour, constraints."></textarea>
            </div>
            <div class="field span2">
              <label for="f-criteria">Acceptance criteria</label>
              <textarea id="f-criteria" name="acceptance_criteria" rows="3" placeholder="endpoint returns 404 for unknown ids&#10;unit tests cover the new branch&#10;no changes outside src/api"></textarea>
              <p class="hint">One per line. The reviewer checks every item; unmet criteria cap the score.</p>
            </div>
            <div class="field">
              <label for="f-title">Title</label>
              <input id="f-title" name="title" placeholder="Defaults to the first line of the request">
            </div>
            <div class="field">
              <label for="f-base">Base branch</label>
              <input id="f-base" name="base_branch" placeholder="current HEAD">
            </div>
            <div class="field span2">
              <div class="label-row">
                <label for="f-repo">Repository</label>
                <div class="seg" role="tablist">
                  <button type="button" class="on" data-repo-mode="local">Local path</button>
                  <button type="button" data-repo-mode="url">Git URL</button>
                </div>
              </div>
              <div data-repo-pane="local">
                <div class="input-group">
                  <input id="f-repo" name="repo_path" required placeholder="/path/to/repo">
                  <button type="button" class="btn" id="btn-browse">Browse…</button>
                </div>
                <div id="browse" class="browse hidden"></div>
                <p class="hint" id="repo-hint">A new directory is created and <code>git init</code>-ed; a repo without commits gets an initial commit.</p>
              </div>
              <div data-repo-pane="url" class="hidden">
                <div class="input-group">
                  <input id="f-url" name="repo_url" placeholder="https://github.com/owner/repo  ·  git@github.com:owner/repo.git  ·  …/tree/branch" spellcheck="false">
                  <input id="f-clone-branch" placeholder="branch (default)" class="narrow">
                  <button type="button" class="btn primary" id="btn-clone">Clone</button>
                </div>
                <p class="hint" id="clone-status">Cloned into the workspace; the task then runs on that checkout and <em>Open a pull request</em> targets its origin.</p>
              </div>
            </div>
          </div>
        </section>

        <div class="grid2">
          <section class="card">
            <header class="card-head"><span class="step">2</span><div><h2>Worker</h2><p>Writes the code. Fresh context every iteration.</p></div></header>
            <div class="fields">
              <div class="field">
                <label for="f-wb">Backend</label>
                <select id="f-wb" name="worker.backend" data-role="worker"></select>
              </div>
              <div class="field">
                <label for="f-wm">Model</label>
                <div class="input-group">
                  <select id="f-wm" name="worker.model_pick" data-model-pick="worker"></select>
                  <input name="worker.model" data-model-custom="worker" class="hidden" placeholder="model id, e.g. gpt-5.5" spellcheck="false">
                  <button type="button" class="btn" data-model-refresh="worker" title="Re-discover models">↻</button>
                </div>
                <p class="hint" data-model-hint="worker"></p>
              </div>
              <div class="field">
                <label for="f-we">Effort</label>
                <select id="f-we" name="worker.effort"></select>
              </div>
              <div class="field">
                <label for="f-wt">Timeout</label>
                <div class="input-group"><input id="f-wt" name="worker.timeout" type="number" value="1800" min="60" step="60"><span class="addon">sec</span></div>
              </div>
              <div class="field span2">
                <label for="f-wr">Role</label>
                <select id="f-wr" name="worker.role"></select>
                <p class="callout" id="role-brief"></p>
              </div>
              <div class="field span2">
                <label for="f-wi">Extra instructions <span class="opt">optional</span></label>
                <textarea id="f-wi" name="worker.instructions" rows="2" placeholder="Appended to the role brief, e.g. “use parameterised queries”, “don't touch the migrations folder”."></textarea>
              </div>
            </div>
          </section>

          <section class="card">
            <header class="card-head"><span class="step">3</span><div><h2>Reviewer</h2><p>A different model. Read-only. Sees only the git diff.</p></div></header>
            <div class="fields">
              <div class="field">
                <label for="f-rb">Backend</label>
                <select id="f-rb" name="reviewer.backend" data-role="reviewer"></select>
              </div>
              <div class="field">
                <label for="f-rm">Model</label>
                <div class="input-group">
                  <select id="f-rm" name="reviewer.model_pick" data-model-pick="reviewer"></select>
                  <input name="reviewer.model" data-model-custom="reviewer" class="hidden" placeholder="model id, e.g. gpt-5.5" spellcheck="false">
                  <button type="button" class="btn" data-model-refresh="reviewer" title="Re-discover models">↻</button>
                </div>
                <p class="hint" data-model-hint="reviewer"></p>
              </div>
              <div class="field">
                <label for="f-re">Effort</label>
                <select id="f-re" name="reviewer.effort"></select>
              </div>
              <div class="field">
                <label for="f-rt">Timeout</label>
                <div class="input-group"><input id="f-rt" name="reviewer.timeout" type="number" value="1800" min="60" step="60"><span class="addon">sec</span></div>
              </div>
              <div class="field span2">
                <p id="pairing" class="pairing"></p>
                <p id="cross-warn" class="warn hidden">Worker and reviewer resolve to the same model — cross-model review is required. Pick a different backend or model.</p>
                <details class="rubric" open>
                  <summary>Scoring rubric · 7 criteria, weighted</summary>
                  <table id="rubric"></table>
                </details>
              </div>
            </div>
          </section>
        </div>

        <section class="card">
          <header class="card-head"><span class="step">4</span><div><h2>Loop</h2><p>When to stop, and what happens on success.</p></div></header>
          <div class="fields cols4">
            <div class="field">
              <label for="f-max">Max iterations</label>
              <input id="f-max" name="loop.max_iterations" type="number" value="5" min="1" max="50">
            </div>
            <div class="field">
              <label for="f-pass">Pass score</label>
              <div class="input-group"><span class="addon">≥</span><input id="f-pass" name="loop.pass_score" type="number" value="9" min="0" max="10" step="0.1"></div>
            </div>
            <div class="field">
              <label for="f-scoring">Scoring</label>
              <select id="f-scoring" name="loop.scoring"><option value="weighted">Weighted average</option><option value="llm">Reviewer's overall</option></select>
            </div>
            <div class="field">
              <label for="f-success">On success</label>
              <select id="f-success" name="loop.on_success"><option value="pr">Open a pull request</option><option value="merge">Merge into base</option><option value="none">Leave on branch</option></select>
            </div>
            <div class="field">
              <label for="f-stale">Stop if no progress</label>
              <div class="input-group"><input id="f-stale" name="loop.stop_if_no_progress" type="number" value="2" min="0"><span class="addon">iters</span></div>
              <p class="hint">0 disables the check.</p>
            </div>
            <div class="field">
              <label for="f-budget">Budget</label>
              <div class="input-group"><span class="addon">$</span><input id="f-budget" name="loop.budget_usd" type="number" step="0.01" min="0" placeholder="unlimited"></div>
              <p class="hint">Uses costs reported by the CLIs.</p>
            </div>
            <div class="field">
              <label for="f-retries">Hand-off retries</label>
              <input id="f-retries" name="loop.handshake_retries" type="number" value="1" min="0" max="5">
              <p class="hint">Re-OFFERs after a NACK.</p>
            </div>
          </div>
          <div class="toggles">
            <label class="toggle">
              <input name="loop.respect_verdict" type="checkbox" checked><span class="switch"></span>
              <span><b>Respect reviewer verdict</b><small>“request_changes” keeps iterating even when the score passes.</small></span>
            </label>
            <label class="toggle">
              <input name="loop.require_tests" type="checkbox"><span class="switch"></span>
              <span><b>Require tests</b><small>NACK the worker hand-off if it reports no test run.</small></span>
            </label>
          </div>
        </section>
      </div>

      <div class="actionbar">
        <span id="form-error" class="error"></span>
        <span class="spacer"></span>
        <button type="button" class="btn" id="btn-cancel-form">Cancel</button>
        <button type="submit" class="btn primary" id="btn-submit">Start task</button>
      </div>
    </form>
  </section>
</template>

<template id="tpl-detail">
  <section class="detail">
    <div class="detail-head">
      <div>
        <a href="/" class="muted small">← tasks</a>
        <h1 id="d-title"></h1>
        <div class="meta" id="d-meta"></div>
      </div>
      <div class="detail-actions">
        <span id="d-status" class="pill"></span>
        <span id="d-score" class="score-big"></span>
        <button class="btn danger hidden" id="btn-cancel">Cancel</button>
        <button class="btn hidden" id="btn-rerun">Re-run</button>
        <button class="btn" id="btn-clone">Clone</button>
        <button class="btn hidden" id="btn-delete">Delete</button>
      </div>
    </div>
    <div class="detail-body">
      <div class="iterations" id="iterations"></div>
      <aside class="log-pane">
        <div class="log-head"><b>Live log</b> <span class="muted small" id="log-state"></span></div>
        <pre id="log"></pre>
      </aside>
    </div>
  </section>
</template>

<script src="/static/app.js"></script>
</body>
</html>
